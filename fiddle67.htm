<!DOCTYPE html>
<html>
  <head>
    <title>Ground Overlays</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
    <!-- jsFiddle will insert css and js -->
<style>
/* Always set the map height explicitly to define the size of the div
       * element that contains the map. */
#map {
  height: 100%;
}

/* Optional: Makes the sample page fill the window. */
html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
}
</style>
<script>
function initMap() {
  const map = new google.maps.Map(document.getElementById("map"), {
    zoom: 17,
    center: { lat: 33.64556, lng: -117.85532 },
  });
  const imageBounds = {
    north: 33.64580,
    south: 33.64501,
    east: -117.85496,
    west: -117.85567,
  };

  historicalOverlay = new google.maps.GroundOverlay(
    "https://geoto.s3.amazonaws.com/images/101Inno-1stF-half-rot67cx.png", imageBounds
  );
  historicalOverlay.setMap(map);
}
</script>
  </head>
  <body>
    <div id="map"></div>

    <!-- Async script executes immediately and must be after any DOM elements used in callback. -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&callback=initMap&v=weekly&channel=2"
      async
    ></script>
  </body>
</html>
